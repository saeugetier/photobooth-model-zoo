name: Build and Release YOLO Models

on:
  push:
    tags:
      - "v*"

jobs:
  build-models:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # wichtig für Release-Upload!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m venv yolo-venv
          . yolo-venv/bin/activate
          pip install --upgrade pip
          pip install numpy==1.26.4
          pip install torch==2.4.0 torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics==8.4.118 onnxruntime onnx==1.16.1 onnxslim==0.1.82 ncnn==1.0.20250503 rknn-toolkit2==2.3.2 pnnx==20260526

      - name: Export YOLO models (ONNX + NCNN + RKNN)
        run: |
          . yolo-venv/bin/activate
          yolo export model=yolo11n-seg.pt format=onnx
          yolo export model=yolo11x-seg.pt format=onnx
          # Keep original ONNX exports, RKNN export triggers another ONNX pass.
          mv yolo11n-seg.onnx yolo11n-seg_onnx.onnx
          mv yolo11x-seg.onnx yolo11x-seg_onnx.onnx
          yolo export model=yolo11n-seg.pt format=ncnn imgsz=320  
          mkdir yolo11n-seg_ncnn_model_320
          mv yolo11n-seg_ncnn_model/* yolo11n-seg_ncnn_model_320
          yolo export model=yolo11n-seg.pt format=ncnn
          yolo export model=yolo11x-seg.pt format=ncnn
          yolo export model=yolo11n-seg.pt format=rknn name=rk3566 quantize=8 imgsz=320 data=dota8.yaml
          yolo export model=yolo11x-seg.pt format=rknn name=rk3566

      - name: Prepare model bundle
        run: |
          mkdir -p export
          cp yolo11n-seg_onnx.onnx export/
          cp yolo11x-seg_onnx.onnx export/
          cp -r yolo11n-seg_ncnn_model export/
          cp -r yolo11n-seg_ncnn_model_320 export/
          cp -r yolo11x-seg_ncnn_model export/
          cp -r yolo11n-seg_rknn_model export/
          cp -r yolo11x-seg_rknn_model export/
          cp models/coco.names export/
          tar -czf yolo-models-${GITHUB_REF_NAME}.tar.gz -C export .

      - name: Create GitHub Release and upload models
        uses: softprops/action-gh-release@v1
        with:
          files: yolo-models-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
